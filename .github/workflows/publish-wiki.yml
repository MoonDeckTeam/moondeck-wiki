name: Publish wiki
on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    if: github.repository == 'MoonDeckTeam/moondeck-wiki'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.WIKI_SYNC_APP_ID }}
          private-key: ${{ secrets.WIKI_SYNC_KEY }}
          repositories: |
            moondeck
            moondeck-buddy
      
      - name: Publish to MoonDeck wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: MoonDeckTeam/moondeck

      - name: Publish to MoonDeckBuddy wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: MoonDeckTeam/moondeck-buddy
